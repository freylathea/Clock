<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .app { width: 380px; height: 700px; background: #000; border: 1px solid #333; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px; }
    header h1 { font-size: 24px; }
    header button { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }

    .content { flex: 1; overflow-y: auto; padding: 0 20px; }
    .tab-view { display: none; }
    .tab-view.active { display: block; }

    /* Alarm Card */
    .alarm-card { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #222; }
    .alarm-time { font-size: 36px; font-weight: 300; }
    .alarm-label { font-size: 12px; color: #888; }
    
    /* Toggle Switch */
    .switch { position: relative; width: 44px; height: 24px; display: inline-block; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #333; border-radius: 24px; cursor: pointer; transition: 0.2s; }
    .slider:before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #888; border-radius: 50%; transition: 0.2s; }
    input:checked + .slider { background: #4CAF50; }
    input:checked + .slider:before { transform: translateX(20px); background: #fff; }

    /* Display Displays */
    .timer-display, .sw-display { font-size: 48px; text-align: center; margin: 40px 0; font-variant-numeric: tabular-nums; }
    .controls { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
    .btn { padding: 10px 20px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; }
    .btn-green { background: #4CAF50; color: #fff; }
    .btn-red { background: #f44336; color: #fff; }
    .btn-gray { background: #333; color: #fff; }

    /* Navigation */
    nav { display: flex; justify-content: space-around; background: #121212; padding: 12px 0; border-top: 1px solid #222; }
    nav button { background: none; border: none; color: #888; font-size: 12px; cursor: pointer; }
    nav button.active { color: #4CAF50; font-weight: bold; }

    .inputs { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
    .inputs input { width: 60px; padding: 8px; background: #222; border: 1px solid #444; color: #fff; text-align: center; border-radius: 8px; }
  </style>
</head>
<body>

<div class="app">
  <header>
    <h1 id="title">Alarm</h1>
    <button id="add-btn" onclick="addAlarm()">+</button>
  </header>

  <div class="content">
    <!-- ALARM TAB -->
    <div id="tab-alarm" class="tab-view active">
      <div id="alarm-list"></div>
    </div>

    <!-- WORLD CLOCK TAB -->
    <div id="tab-world" class="tab-view">
      <div id="world-clock-list"></div>
    </div>

    <!-- TIMER TAB -->
    <div id="tab-timer" class="tab-view">
      <div class="inputs">
        <input type="number" id="t-min" placeholder="MM" min="0" max="59" value="01">
        <input type="number" id="t-sec" placeholder="SS" min="0" max="59" value="00">
      </div>
      <div class="timer-display" id="timer-display">01:00</div>
      <div class="controls">
        <button class="btn btn-green" onclick="startTimer()">Start</button>
        <button class="btn btn-red" onclick="pauseTimer()">Pause</button>
        <button class="btn btn-gray" onclick="resetTimer()">Reset</button>
      </div>
    </div>

    <!-- STOPWATCH TAB -->
    <div id="tab-sw" class="tab-view">
      <div class="sw-display" id="sw-display">00:00.00</div>
      <div class="controls">
        <button class="btn btn-green" onclick="startSW()">Start</button>
        <button class="btn btn-red" onclick="pauseSW()">Pause</button>
        <button class="btn btn-gray" onclick="resetSW()">Reset</button>
      </div>
    </div>
  </div>

  <nav>
    <button class="nav-btn active" onclick="switchTab('alarm', this)">Alarm</button>
    <button class="nav-btn" onclick="switchTab('world', this)">World Clock</button>
    <button class="nav-btn" onclick="switchTab('timer', this)">Timer</button>
    <button class="nav-btn" onclick="switchTab('sw', this)">Stopwatch</button>
  </nav>
</div>

<script src="app.js"></script>
</body>
</html>
